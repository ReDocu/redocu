<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace">
  <style>
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .scan { animation: scan 4s linear infinite; }
    @keyframes scan { from { transform: translateY(-20px); } to { transform: translateY(280px); } }
  </style>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1A2430" stroke-width="1"/>
    </pattern>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5FE3FF" stop-opacity="0"/>
      <stop offset="1" stop-color="#5FE3FF" stop-opacity=".18"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="260" rx="10" fill="#050709"/>
  <rect width="1200" height="260" rx="10" fill="url(#grid)"/>
  <rect class="scan" x="0" y="0" width="1200" height="20" fill="url(#beam)"/>
  <!-- corner brackets -->
  <g stroke="#5FE3FF" stroke-width="2" fill="none">
    <path d="M20 50V20H50"/><path d="M1150 20H1180V50"/>
    <path d="M20 210V240H50"/><path d="M1150 240H1180V210"/>
  </g>
  <text x="60" y="70" fill="#8AA4C2" font-size="15" letter-spacing="2">// IDENTIFICATION_</text>
  <text x="56" y="150" fill="#E8F4FF" font-size="84" font-weight="700" letter-spacing="6">DOCU<tspan class="blink" fill="#5FE3FF">_</tspan></text>
  <text x="60" y="192" fill="#5FE3FF" font-size="20" letter-spacing="3">AX DEVELOPER · AI AGENT TOOLS · FULL STACK</text>
  <!-- readout -->
  <g font-size="14" letter-spacing="1">
    <text x="820" y="80" fill="#8AA4C2">ID</text><text x="920" y="80" fill="#E8F4FF">0x44OC-2026</text>
    <text x="820" y="110" fill="#8AA4C2">STACK</text><text x="920" y="110" fill="#E8F4FF">C++ / UNITY / WEB / AI</text>
    <text x="820" y="140" fill="#8AA4C2">STATUS</text><text x="920" y="140" fill="#FF9A3C"><tspan class="blink">●</tspan> BUILDING</text>
  </g>
  <rect x="820" y="168" width="320" height="4" fill="#1A2430"/>
  <rect x="820" y="168" width="214" height="4" fill="#5FE3FF"/>
</svg>
